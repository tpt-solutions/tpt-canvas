[workspace]
resolver = "2"
members = [
    "crates/tpt-canvas",
    "crates/tpt-canvas-svg",
    "crates/tpt-canvas-pdf",
    "crates/tpt-canvas-raster",
    "crates/tpt-canvas-webgpu",
    "crates/tpt-canvas-canvas2d",
    "crates/tpt-canvas-wgpu",
    "crates/tpt-gallery",
    "crates/tpt-canvas-facade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/tpt-solutions/tpt-canvas"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
libm = "0.2"
tpt-canvas = { path = "crates/tpt-canvas" }
tpt-canvas-raster = { path = "crates/tpt-canvas-raster" }
tpt-canvas-webgpu = { path = "crates/tpt-canvas-webgpu" }

[profile.test]
opt-level = 1
