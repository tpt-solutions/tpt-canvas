[workspace]
resolver = "2"
members = [
    "crates/tpt-math-stub",
    "crates/tpt-color-stub",
    "crates/tpt-text-stub",
    "crates/tpt-raster-stub",
    "crates/tpt-testkit-stub",
    "crates/tpt-canvas",
    "crates/tpt-canvas-svg",
    "crates/tpt-canvas-pdf",
    "crates/tpt-canvas-raster",
    "crates/tpt-canvas-webgpu",
    "crates/tpt-canvas-canvas2d",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/tpt-solutions/tpt-canvas"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
libm = "0.2"
tpt-math-stub = { path = "crates/tpt-math-stub" }
tpt-color-stub = { path = "crates/tpt-color-stub" }
tpt-text-stub = { path = "crates/tpt-text-stub" }
tpt-raster-stub = { path = "crates/tpt-raster-stub" }
tpt-testkit-stub = { path = "crates/tpt-testkit-stub" }
tpt-canvas = { path = "crates/tpt-canvas" }
tpt-canvas-raster = { path = "crates/tpt-canvas-raster" }

[profile.test]
opt-level = 1
