# cargo-deny policy: licenses, advisories and bans for the whole workspace.
# Run locally with `cargo deny check`. CI runs the same check.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
    "thumbv7em-none-eabihf",
]

[advisories]
# Both are "unmaintained" notices, not known vulnerabilities, and no safe upgrade exists.
# They arrive only through tpt-text (pinned by git rev). Remove these once tpt-text moves
# to harfrust (for rustybuzz) and skrifa (for ttf-parser).
ignore = [
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; pulled in by tpt-text, no safe upgrade. Track tpt-text moving to harfrust." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; pulled in by rustybuzz via tpt-text, no safe upgrade. Track tpt-text moving to skrifa." },
]

[licenses]
# Only permissive licenses. Copyleft needs a decision before it is added here.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates are path dependencies without a version requirement.
allow-wildcard-paths = true
# The C-FFI rule lives in CI (`-sys` name audit). cargo-deny cannot match name patterns.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# tpt-text is not on crates.io yet; crates/tpt-canvas-text and crates/tpt-canvas-wgpu pin it to a rev.
allow-git = ["https://github.com/tpt-solutions/tpt-text"]
