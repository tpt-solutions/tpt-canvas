[package]
name = "tpt-canvas-canvas2d"
description = "Canvas2D backend for tpt-canvas: maps drawing calls onto a browser CanvasRenderingContext2D (wasm32 only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["canvas2d", "browser", "wasm", "web-sys", "2d"]
categories = ["graphics", "web-programming", "wasm"]

[dependencies]
tpt-canvas.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CanvasWindingRule",
    "Document",
    "HtmlCanvasElement",
    "ImageData",
    "Path2d",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
