[package]
name = "tpt-canvas-playground"
description = "Browser playground for tpt-canvas: a small scene language drawn to a canvas element."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["playground", "wasm", "canvas", "dsl", "2d"]
categories = ["graphics", "web-programming", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-canvas.workspace = true

[dev-dependencies]
tpt-canvas-raster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tpt-canvas-canvas2d = { path = "../tpt-canvas-canvas2d" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
