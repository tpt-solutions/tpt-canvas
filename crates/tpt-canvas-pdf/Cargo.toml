[package]
name = "tpt-canvas-pdf"
description = "PDF backend for tpt-canvas: content streams with native curves, shadings and alpha."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pdf", "vector-graphics", "2d", "canvas", "deterministic"]
categories = ["graphics", "rendering::data-formats"]

[dependencies]
tpt-canvas.workspace = true

[dev-dependencies]
tpt-canvas = { workspace = true, features = ["testkit"] }
