[package]
name = "tpt-canvas"
description = "Deterministic, pure-Rust 2D vector graphics API: paths, styles, state, and a multi-backend trait. no_std + alloc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["vector-graphics", "2d", "canvas", "no-std", "deterministic"]
categories = ["graphics", "no-std"]

[features]
# Enables the golden-file helper (`testkit::check_golden`), which needs std.
testkit = []

[dependencies]
libm.workspace = true

[dev-dependencies]
# Lets the README example, which draws to SVG, run as a doctest.
tpt-canvas-svg = { path = "../tpt-canvas-svg" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
