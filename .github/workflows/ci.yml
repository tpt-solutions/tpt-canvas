name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml selects the channel, components and cross targets.
      - uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: no_std build (wasm32)
        run: >
          cargo build --target wasm32-unknown-unknown
          -p tpt-canvas -p tpt-math-stub -p tpt-color-stub -p tpt-text-stub -p tpt-raster-stub

      - name: no_std build (bare-metal, thumbv7em)
        run: >
          cargo build --target thumbv7em-none-eabihf
          -p tpt-canvas -p tpt-math-stub -p tpt-color-stub -p tpt-text-stub -p tpt-raster-stub

      - name: Canvas2D backend (wasm32)
        run: cargo build --target wasm32-unknown-unknown -p tpt-canvas-canvas2d

      - name: Zero C-FFI dependency audit
        run: |
          if cargo tree --workspace -e normal,build --prefix none | grep -E '(-sys|^cc |^cmake|^bindgen)'; then
            echo "C FFI dependency found"
            exit 1
          fi
