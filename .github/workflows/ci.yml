name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml selects the channel, components and cross targets.
      - uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: no_std build (wasm32)
        run: >
          cargo build --target wasm32-unknown-unknown
          -p tpt-canvas -p tpt-math-stub -p tpt-color-stub -p tpt-text-stub -p tpt-raster-stub

      - name: no_std build (bare-metal, thumbv7em)
        run: >
          cargo build --target thumbv7em-none-eabihf
          -p tpt-canvas -p tpt-math-stub -p tpt-color-stub -p tpt-text-stub -p tpt-raster-stub

      - name: Canvas2D backend (wasm32)
        run: cargo build --target wasm32-unknown-unknown -p tpt-canvas-canvas2d

      - name: Cross-target determinism (wasm32 under Node)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo test -p tpt-canvas --test determinism --target wasm32-unknown-unknown

      - name: Zero C-FFI dependency audit
        # renderdoc-sys is pure-Rust declarations pulled in by wgpu-core on native targets.
        # It compiles and links nothing, so it is allowed. Anything else matching is a failure.
        run: |
          hits=$(cargo tree --workspace -e normal,build --prefix none | sort -u | grep -E '(-sys|^cc |^cmake|^bindgen)' | grep -v '^renderdoc-sys ' || true)
          if [ -n "$hits" ]; then
            echo "C FFI dependency found:"
            echo "$hits"
            exit 1
          fi
