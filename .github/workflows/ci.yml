name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml selects the channel, components and cross targets.
      - uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: no_std build (wasm32)
        run: >
          cargo build --target wasm32-unknown-unknown
          -p tpt-canvas

      - name: no_std build (bare-metal, thumbv7em)
        run: >
          cargo build --target thumbv7em-none-eabihf
          -p tpt-canvas

      - name: Canvas2D backend (wasm32)
        run: cargo build --target wasm32-unknown-unknown -p tpt-canvas-canvas2d

      - name: Cross-target determinism (wasm32 under Node)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo test -p tpt-canvas --test determinism --target wasm32-unknown-unknown

      - name: Zero C-FFI dependency audit
        # renderdoc-sys is pure-Rust declarations pulled in by wgpu-core on native targets.
        # wayland-sys is pulled in by wgpu-hal on Unix with the `dlopen` feature, so its build
        # script returns before probing or linking libwayland. Both compile and link nothing,
        # so they are allowed. Anything else matching is a failure.
        run: |
          hits=$(cargo tree --workspace -e normal,build --prefix none | sort -u | grep -E '(-sys|^cc |^cmake|^bindgen)' | grep -v -E '^(renderdoc-sys|wayland-sys) ' || true)
          if [ -n "$hits" ]; then
            echo "C FFI dependency found:"
            echo "$hits"
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The runner drives the Chrome that is first on PATH (the runner image's own install),
      # which can differ from the one setup-chrome installs. Match ChromeDriver to that one.
      - name: Install ChromeDriver matching the installed Chrome
        run: |
          major=$(google-chrome --version | grep -oE '[0-9]+' | head -n 1)
          version=$(curl -fsSL "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${major}")
          curl -fsSL -o "$RUNNER_TEMP/chromedriver.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chromedriver-linux64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o -j "$RUNNER_TEMP/chromedriver.zip" 'chromedriver-linux64/chromedriver' -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # wasm-bindgen-test-runner prefers $CHROMEDRIVER over PATH, and PATH can still resolve a
          # different chromedriver first, so pin the binary explicitly for the test steps.
          echo "CHROMEDRIVER=$HOME/.local/bin/chromedriver" >> "$GITHUB_ENV"
          "$HOME/.local/bin/chromedriver" --version

      - name: Install wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Canvas2D browser tests (headless Chrome)
        env:
          WASM_BINDGEN_USE_BROWSER: "1"
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p tpt-canvas-canvas2d --target wasm32-unknown-unknown --test browser

      - name: Playground browser tests (headless Chrome)
        env:
          WASM_BINDGEN_USE_BROWSER: "1"
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p tpt-canvas-playground --target wasm32-unknown-unknown --test browser

  deny:
    # Licenses, advisories, bans and sources. The policy lives in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  examples:
    # Runs the gallery and keeps the rendered outputs as a build artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Run gallery examples
        run: |
          cargo run -p tpt-canvas-gallery --example all_backends
          cargo run -p tpt-canvas-gallery --example analog_clock
          cargo run -p tpt-canvas-gallery --example bar_chart
          cargo run -p tpt-canvas-gallery --example pdf_table
          cargo run -p tpt-canvas-gallery --example hero
          cargo run -p tpt-canvas-gallery --example labels

      - name: Check generated PDFs with qpdf
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          for f in gallery-out/*.pdf; do
            qpdf --check "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-output
          path: gallery-out/

  wgpu-parity:
    # The GPU parity tests skip without an adapter. Mesa's lavapipe is a software
    # Vulkan driver, so with it installed the tests run on this runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: wgpu parity tests
        run: cargo test -p tpt-canvas-wgpu -- --nocapture

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  semver:
    # Compares the public API of each crate with the PR's base branch. The workspace is
    # publish = false for now, so this job is a guard for the first release, not a gate yet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: API compatibility against the base branch
        run: cargo semver-checks --workspace --baseline-rev "origin/${{ github.base_ref }}"

  bench-smoke:
    # Runs each benchmark once so they keep compiling and do not panic. Timing is not checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Benchmarks, one iteration each
        run: cargo bench -p tpt-canvas-bench -- --test

  bench-regression:
    # Times the pipeline benchmarks on the base branch and on this pull request, then fails when
    # a benchmark is more than 50% slower. The threshold is loose because shared runners are noisy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Save the base branch timings
        run: cargo bench -p tpt-canvas-bench --bench pipeline -- --save-baseline base --warm-up-time 1 --measurement-time 3

      # clean: false keeps target/, which holds the saved baseline.
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Time this pull request against the base
        run: cargo bench -p tpt-canvas-bench --bench pipeline -- --baseline base --warm-up-time 1 --measurement-time 3

      - name: Compare
        run: python3 scripts/bench_compare.py base --threshold 0.5
