[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# tpt-canvas is not on crates.io yet. Use a path dependency inside a checkout.
[dependencies]
tpt-canvas = { git = "https://github.com/tpt-solutions/tpt-canvas" }
tpt-canvas-canvas2d = { git = "https://github.com/tpt-solutions/tpt-canvas" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement"] }

[workspace]
